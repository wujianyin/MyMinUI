interface=wlan1
driver=nl80211
ctrl_interface=/var/run/hostapd
ssid=AwCast
channel=1
#hw_mode=a
ieee80211n=1
ignore_broadcast_ssid=0
wpa=2
rsn_pairwise=CCMP
wpa_passphrase=12345678
# support detected and displayed wifi6
ieee80211ax=1
hw_mode=g
ht_capab=[SHORT-GI-20][SHORT-GI-40][HT-40-]
vht_oper_chwidth=0
he_basic_mcs_nss_set=1
he_oper_chwidth=0
